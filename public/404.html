<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pathwise — Career guidance, made personal</title>
    <script>
      // Single-page app routing for GitHub Pages.
      // Redirects 404s back to the root with the path encoded as a query param.
      // Technique from: https://github.com/rafgraph/spa-github-pages
      var segmentCount = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
